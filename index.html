<!DOCTYPE html>
<html lang="de" class="state-menu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" id="themeColor" content="#0c0c0c">
<title>Stopwatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-home:    #0c0c0c;
    --bg-active:  #151515;
    --bg-running: #1f1f1f;
    --fg:         #f2f2f2;
    --fg-mute:    rgba(242, 242, 242, 0.45);
    --fg-faint:   rgba(242, 242, 242, 0.25);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
  }

  html { background: var(--bg-home); }
  body.state-menu    { background: var(--bg-home); }
  body.state-ready   { background: var(--bg-active); }
  body.state-running { background: var(--bg-running); }
  body.state-paused  { background: var(--bg-active); }

  body {
    font-family: "Geist", -apple-system, BlinkMacSystemFont,
                 "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
    color: var(--fg);
    position: fixed;
    inset: 0;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .bg-image {
    position: fixed;
    top: 48%;
    left: 0;
    width: 100%;
    height: auto;
    pointer-events: none;
    z-index: 0;
    display: none;
    filter: saturate(0.85);
    -webkit-user-drag: none;
  }
  body:not(.state-menu) .bg-image { display: block; }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: linear-gradient(
      to bottom,
      var(--bg-home) 0%,
      var(--bg-home) 30%,
      rgba(12, 12, 12, 0.88) 40%,
      rgba(12, 12, 12, 0.62) 55%,
      rgba(12, 12, 12, 0.28) 80%,
      rgba(12, 12, 12, 0.15) 100%
    );
    display: none;
    pointer-events: none;
    z-index: 1;
  }
  body:not(.state-menu)::after { display: block; }

  .back-btn {
    position: fixed;
    top: max(18px, env(safe-area-inset-top));
    left: max(16px, env(safe-area-inset-left));
    padding: 10px 12px;
    background: transparent;
    color: var(--fg-mute);
    border: none;
    font-family: inherit;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 1.5px;
    cursor: pointer;
    z-index: 10;
    display: none;
  }
  .back-btn:active { color: var(--fg); }
  body:not(.state-menu) .back-btn { display: block; }

  .brand {
    position: fixed;
    top: calc(max(18px, env(safe-area-inset-top)) + 12px);
    left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--fg-faint);
    pointer-events: none;
    display: none;
    z-index: 2;
  }
  body.state-menu .brand { display: block; }

  .start-btn {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 18px 56px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 5px;
    text-transform: uppercase;
    background: transparent;
    color: var(--fg);
    border: 1px solid rgba(242, 242, 242, 0.35);
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    z-index: 2;
    display: none;
  }
  .start-btn:active {
    background: rgba(242, 242, 242, 0.06);
    border-color: rgba(242, 242, 242, 0.6);
  }
  body.state-menu .start-btn { display: block; }

  .stopwatch {
    position: fixed;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: "Geist", -apple-system, BlinkMacSystemFont,
                 "Helvetica Neue", sans-serif;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
    display: none;
    align-items: baseline;
    justify-content: center;
    gap: 0;
    font-weight: 300;
    z-index: 2;
    white-space: nowrap;
  }
  body.state-ready    .stopwatch,
  body.state-running  .stopwatch,
  body.state-paused   .stopwatch { display: flex; }

  .sw-main {
    font-size: clamp(80px, 23vw, 172px);
    line-height: 1;
    letter-spacing: -0.045em;
    font-weight: 400;
  }
  .sw-ms {
    font-size: clamp(30px, 8.5vw, 64px);
    line-height: 1;
    letter-spacing: -0.025em;
    font-weight: 200;
    opacity: 0.5;
    margin-left: 4px;
  }

  .hint {
    position: fixed;
    bottom: calc(max(28px, env(safe-area-inset-bottom)) + 8px);
    left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    color: var(--fg-faint);
    pointer-events: none;
    display: none;
    font-weight: 400;
    z-index: 2;
  }
  body.state-ready   .hint,
  body.state-running .hint,
  body.state-paused  .hint { display: block; }
</style>
</head>
<body class="state-menu">
  <img class="bg-image" src="wallpapers-leo-messi-v0-dlkenu1wdnvd1.webp" alt="" aria-hidden="true">
  <button class="back-btn" id="backBtn" type="button">← back</button>
  <div class="brand">Stopwatch</div>
  <button class="start-btn" id="startBtn" type="button">Start</button>
  <div class="stopwatch">
    <span class="sw-main" id="swMain">00</span><span class="sw-ms" id="swMs">.000</span>
  </div>
  <div class="hint" id="hint"></div>

<script>
(function () {
  const html      = document.documentElement;
  const body      = document.body;
  const themeMeta = document.getElementById('themeColor');
  const startBtn  = document.getElementById('startBtn');
  const backBtn   = document.getElementById('backBtn');
  const swMain    = document.getElementById('swMain');
  const swMs      = document.getElementById('swMs');
  const hint      = document.getElementById('hint');

  const HINTS = {
    ready:   'Tap to start',
    running: 'Tap to pause · Double tap to reset',
    paused:  'Tap to start · Double tap to reset',
  };

  let state       = 'menu';
  let startTime   = 0;
  let accumulated = 0;
  let rafId       = null;
  let resetWindow = null;

  const RESET_WINDOW_MS = 260;

  function setState(s) {
    state = s;
    body.className = 'state-' + s;
    html.className = 'state-' + s;
    hint.textContent = HINTS[s] || '';
  }

  function render(totalMs) {
    const totalSec = Math.floor(totalMs / 1000);
    const ms = Math.floor(totalMs % 1000);
    if (totalSec < 60) {
      swMain.textContent = String(totalSec).padStart(2, '0');
    } else {
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      swMain.textContent = m + ':' + String(s).padStart(2, '0');
    }
    swMs.textContent = '.' + String(ms).padStart(3, '0');
  }

  function tick() {
    render(accumulated + (performance.now() - startTime));
    rafId = requestAnimationFrame(tick);
  }

  function startRunning() {
    startTime = performance.now();
    setState('running');
    rafId = requestAnimationFrame(tick);
  }

  function pause() {
    accumulated += performance.now() - startTime;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    render(accumulated);
    setState('paused');
  }

  function resume() {
    startTime = performance.now();
    setState('running');
    rafId = requestAnimationFrame(tick);
  }

  function reset() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    accumulated = 0;
    startTime = 0;
    render(0);
    setState('ready');
  }

  function goToMenu() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    if (resetWindow) { clearTimeout(resetWindow); resetWindow = null; }
    accumulated = 0;
    startTime = 0;
    render(0);
    setState('menu');
  }

  startBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  startBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    setState('ready');
  });

  backBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  backBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    goToMenu();
  });

  document.addEventListener('pointerdown', function (e) {
    if (e.target.closest('button')) return;

    if (state === 'ready') {
      startRunning();
      return;
    }

    if (state === 'running' || state === 'paused') {
      if (resetWindow) {
        clearTimeout(resetWindow);
        resetWindow = null;
        reset();
        return;
      }

      if (state === 'running') pause();
      else resume();

      resetWindow = setTimeout(function () {
        resetWindow = null;
      }, RESET_WINDOW_MS);
    }
  }, { passive: true });

  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });

  render(0);
})();
</script>
</body>
</html>
